name: Build Locus with Joystick

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show joystick on main view
        run: |
          # 直接在主地图视图加上自带摇杆
          sed -i '' 's/var body: some View/var body: some View\n        JoystickPad()/' Locus/Features/Map/MapHomeView.swift
      
      - name: Build ipa
        run: |
          xcodebuild -project Locus.xcodeproj -scheme Locus -configuration Release -sdk iphoneos build CONFIGURATION_BUILD_DIR=build/ CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -r build/Locus.app build/Payload/
          cd build && zip -r Locus-Joystick.ipa Payload
      
      - name: Download
        uses: actions/upload-artifact@v4
        with:
          name: Locus-Joystick
          path: build/Locus-Joystick.ipa
